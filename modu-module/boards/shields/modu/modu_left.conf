CONFIG_ZMK_BLE=y
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_USB=y

CONFIG_ZMK_KSCAN_MATRIX_POLLING=y
CONFIG_ZMK_KSCAN_DIRECT_POLLING=y

# Trackball (PMW3610)
# Listener enabled in modu_left.overlay -> motion reports as USB HID mouse movement.
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y
CONFIG_PMW3610_ALT=y
CONFIG_PMW3610_ALT_POLL_INTERVAL_MS=15

# Boot-time inner/outer orientation selector on P0.08.
CONFIG_MODU_ALT_THUMB_KSCAN=y

# Battery
CONFIG_ZMK_BATTERY_REPORTING=y

# PWM LED breath effect
CONFIG_PWM=y
CONFIG_MODU_LED_BREATH=y

# Remember the macOS overlay (mac_layer) across reboots.
# Central only: the central is the half that resolves the keymap.
CONFIG_MODU_OS_MODE_PERSIST=y
CONFIG_MODU_OS_MODE_LAYER=1

# ZMK Studio (realtime keymap editing over USB).
# Central only - the central is the half that resolves the keymap, and ZMK
# gates the RPC on ZMK_SPLIT_ROLE_CENTRAL. The matching `studio-rpc-usb-uart`
# snippet is passed by build.sh for this shield only; it is what creates the
# CDC-ACM endpoint the editor talks to.
CONFIG_ZMK_STUDIO=y
